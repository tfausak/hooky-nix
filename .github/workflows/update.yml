name: Update

on:
  schedule:
    - cron: "0 12 * * 1" # every Monday at noon
  workflow_dispatch: null

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31

      - name: Check for new version
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(grep 'version = ' flake.nix | head -1 | sed 's/.*"\(.*\)".*/\1/')
          latest=$(gh release view --repo brandonchinn178/hooky --json tagName -q '.tagName' | sed 's/^v//')
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$current" != "$latest" ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update flake.nix
        if: steps.check.outputs.update == 'true'
        env:
          VERSION: ${{ steps.check.outputs.latest }}
        run: |
          sed -i "s/version = \".*\"/version = \"${VERSION}\"/" flake.nix

          declare -A suffixes=(
            ["aarch64-darwin"]="darwin-arm64"
            ["x86_64-darwin"]="darwin-x86_64"
            ["aarch64-linux"]="linux-arm64"
            ["x86_64-linux"]="linux-x86_64"
          )

          for system in "${!suffixes[@]}"; do
            suffix="${suffixes[$system]}"
            url="https://github.com/brandonchinn178/hooky/releases/download/v${VERSION}/hooky-${VERSION}-${suffix}"
            hash=$(nix store prefetch-file --json "$url" | jq -r '.hash')
            sed -i "/^        ${system} = {$/,/^        };$/s|hash = \".*\";|hash = \"${hash}\";|" flake.nix
          done

      - name: Create pull request
        if: steps.check.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.latest }}
          CURRENT: ${{ steps.check.outputs.current }}
        run: |
          existing=$(gh pr list --search "in:title Update hooky to ${VERSION}" --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            echo "PR #${existing} already exists for v${VERSION}"
            exit 0
          fi

          branch="update-hooky-${VERSION}"
          git checkout -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.nix
          git commit -m "Update hooky to ${VERSION}"
          git push -u origin "$branch"
          gh pr create \
            --title "Update hooky to ${VERSION}" \
            --body "Automated update of hooky from ${CURRENT} to ${VERSION}."
